<style>
:root{--teal:#0f3b3f;--teal2:#16575c;--gold:#c9a24b;--cream:#f7f2ea;--ink:#1c2426;--mut:#5f6b6d;--red:#d6334a}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.55;font-size:16px;padding-bottom:84px}
img{max-width:100%;height:auto;display:block}
.w{max-width:640px;margin:0 auto;padding:0 18px}
section{padding:40px 0}
h1,h2,h3{font-family:"Playfair Display",serif;color:var(--teal);line-height:1.15}
h2{font-size:28px;margin-bottom:18px}
.hero{background:var(--teal);color:#fff;padding:26px 0 34px}
.eyebrow{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.hero h1{color:#fff;font-size:32px;margin-bottom:16px}
.hero .ph{border-radius:20px;overflow:hidden;margin-bottom:16px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.pr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;color:var(--ink);border-radius:18px;padding:14px 18px;margin-bottom:14px}
.old{display:block;color:var(--mut);text-decoration:line-through;font-size:18px}
.new{font:800 38px "Playfair Display",serif;color:var(--teal);white-space:nowrap}
.save{background:#fdeaee;color:var(--red);font-weight:800;font-size:13px;padding:7px 12px;border-radius:999px;text-align:center}
.btn{display:block;width:100%;border:0;cursor:pointer;font:800 18px Manrope,sans-serif;min-height:58px;padding:16px 22px;border-radius:999px;background:var(--gold);color:#1b1608;box-shadow:0 6px 0 #9a7a2f;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #9a7a2f}
.btn:disabled{opacity:.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(15,59,63,.1);display:flex;flex-direction:column}
.dc img{width:100%;aspect-ratio:1/1;object-fit:cover}
.dn{padding:10px 12px 4px;font-weight:700;font-size:14px;flex:1}
.dbtn{margin:6px 12px 12px;border:2px solid var(--teal);background:#fff;color:var(--teal);font:700 14px Manrope,sans-serif;padding:10px;border-radius:999px;cursor:pointer}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 6px 24px rgba(15,59,63,.12)}
.card h3{font-size:23px;margin-bottom:10px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;color:var(--mut)}
input[type=text],input[type=tel],select{width:100%;font:600 17px Manrope,sans-serif;padding:15px 14px;border:2px solid #e0e6e5;border-radius:12px;background:#f9fbfb;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--teal2)}
.hp{position:absolute;left:-9999px}
form .btn{margin-top:18px}
.st{min-height:20px;margin-top:10px;font-size:14px;text-align:center}.err{color:var(--red)}
.ok{display:none;text-align:center;font-weight:700;color:#1f7a4c;padding:10px 0}
.desc p{margin-bottom:14px}
.sz{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(15,59,63,.1)}
.sz td{padding:13px 16px;border-bottom:1px solid #edf1f0;font-size:15px}.sz td:last-child{font-weight:800;text-align:right;color:var(--teal)}.sz tr:last-child td{border:0}
.sp-photo{border-radius:18px;overflow:hidden;margin-bottom:18px}
.tick{list-style:none;padding:0}.tick li{padding:11px 0 11px 34px;position:relative;border-bottom:1px solid #e8ece9}
.tick li:before{content:"✓";position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.adv{background:var(--teal);color:#fff}.adv h2{color:#fff}
.ai{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.15)}.ai:last-child{border:0}
.ai i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1b1608;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
.ai b{display:block;font-size:17px}.ai span{color:#c4d6d5;font-size:15px}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;display:flex;gap:14px;background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 12px rgba(15,59,63,.08)}
.steps li:before{content:counter(s);flex:none;width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;font:800 18px "Playfair Display",serif;display:flex;align-items:center;justify-content:center}
.rv{display:flex;gap:14px;background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(15,59,63,.1)}
.rv img{flex:none;width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.rv b{display:block;font-size:16px}.rv small{color:var(--mut)}.rv .s{color:#e8a600;letter-spacing:2px;margin:2px 0 4px}.rv p{font-size:15px}
.vd{border-radius:18px;overflow:hidden;background:#000;box-shadow:0 8px 24px rgba(15,59,63,.2)}.vd video{width:100%;display:block}
.cr{display:block;width:100%;border:0;padding:0;background:none;cursor:pointer;border-radius:20px;overflow:hidden;box-shadow:0 8px 28px rgba(15,59,63,.25)}.cr img{width:100%;height:auto}
.pl{display:block;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.final{background:var(--teal);color:#fff;text-align:center}.final h2{color:#fff}.final .ph{border-radius:20px;overflow:hidden;margin-bottom:16px}.final .pr{text-align:left}.final .card{margin-top:22px;text-align:left;color:var(--ink)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:22px 18px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px}
.bar .pp{line-height:1.1;white-space:nowrap}.bar .pp s{display:block;font-size:13px;color:var(--mut)}.bar .pp b{font:800 22px "Playfair Display",serif;color:var(--teal)}
.bar .btn{min-height:50px;padding:12px;font-size:16px}
.ov{position:fixed;inset:0;background:rgba(10,25,27,.7);display:none;align-items:flex-end;justify-content:center;z-index:60}.ov.open{display:flex}
.md{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;position:relative}
.md h3{font-size:24px;margin-bottom:4px}.md .sub{color:var(--mut);font-size:14px;margin-bottom:6px}
.x{position:absolute;top:10px;right:14px;background:none;border:0;font-size:32px;color:var(--mut);cursor:pointer}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:24px}.bar{display:none}body{padding-bottom:0}}

.sm{max-width:260px;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(15,59,63,.18)}
.sm img{width:100%}
.hp{position:absolute;left:-9999px}
.rv img.big{width:100%;height:auto;border-radius:14px;border:0;margin-bottom:10px;max-width:none}
.rv.col{display:block}.rv.col .big{aspect-ratio:auto}
.rvs{max-width:200px;margin:0 auto 10px}
.vd{border-radius:18px;overflow:hidden;background:#000;box-shadow:0 8px 24px rgba(15,59,63,.2)}.vd video{width:100%;display:block}

.rv.col{display:flex}

body{padding-bottom:0}.ty{min-height:100vh;display:flex;align-items:center;background:var(--teal);color:#fff;text-align:center;padding:30px 0}

.chk{width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--gold);color:#1b1608;font-size:46px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ty .card{margin-top:24px;color:var(--ink);text-align:left}.ty .card b{display:block;margin-bottom:6px}
.ty .btn{display:block;text-decoration:none;margin-top:22px}</style></head><body>
